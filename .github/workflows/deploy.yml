name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  image:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      ROLLBACK_WEBHOOK: ${{ secrets.ROLLBACK_WEBHOOK }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Deploy immutable image
        if: env.DEPLOY_WEBHOOK != ''
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          curl --fail-with-body --retry 3 -X POST
          -H "Authorization: Bearer $DEPLOY_TOKEN"
          -H 'Content-Type: application/json'
          --data "{\"digest\":\"$IMAGE_DIGEST\",\"environment\":\"${{ inputs.environment }}\"}"
          "$DEPLOY_WEBHOOK"
      - name: Smoke test
        if: env.DEPLOY_URL != ''
        run: curl --fail --retry 12 --retry-delay 5 "$DEPLOY_URL/ready"
      - name: Roll back
        if: failure() && env.ROLLBACK_WEBHOOK != ''
        run: >-
          curl --fail-with-body -X POST
          -H "Authorization: Bearer $DEPLOY_TOKEN"
          "$ROLLBACK_WEBHOOK"
