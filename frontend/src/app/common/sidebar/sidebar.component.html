<nav class="command-rail" aria-label="Fő navigáció">
  <a class="brand" routerLink="/" aria-label="Miserere Mei kezdőlap">
    <span class="brand-mark">MM</span>
    <span><strong>Miserere Mei</strong><small>WASTELAND // 2050</small></span>
  </a>

  <div class="system-status"><span></span> RENDSZER ONLINE</div>

  <div class="nav-section">
    <span class="nav-label">Küldetés</span>
    <a routerLink="/place/GameBeginning" routerLinkActive="active"><i class="ni ni-button-power"></i> Játék indítása</a>
    <a routerLink="/preface" routerLinkActive="active"><i class="ni ni-collection"></i> Előszó</a>
    <a routerLink="/map" routerLinkActive="active"><i class="ni ni-album-2"></i> Térkép</a>
  </div>

  @if ((auth.user$ | async)?.role === 3) {
    <div class="nav-section">
      <span class="nav-label">Admin protokoll</span>
      <a routerLink="/allplace" routerLinkActive="active"><i class="ni ni-istanbul"></i> Helyszínek</a>
      <a routerLink="/users" routerLinkActive="active"><i class="ni ni-user-run"></i> Felhasználók</a>
    </div>
  }

  <div class="nav-section nav-section--bottom">
    <span class="nav-label">Rendszer</span>
    <a routerLink="/contact" routerLinkActive="active"><i class="ni ni-email-83"></i> Kapcsolat</a>
    @if (auth.user$ | async) {
      <button type="button" (click)="auth.logout()"><i class="ni ni-button-power"></i> Kijelentkezés</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active"><i class="ni ni-single-02"></i> Bejelentkezés</a>
    }
  </div>
</nav>
