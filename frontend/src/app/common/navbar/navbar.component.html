<header class="topbar">
  <a class="mobile-brand" routerLink="/"><span>MM</span> MISERERE MEI</a>
  <div class="mission-id"><small>AKTÍV PROTOKOLL</small><strong>LIBRARY RUN // 2050</strong></div>
  <div class="topbar-actions">
    <a class="launch" routerLink="/place/GameBeginning">KÜLDETÉS INDÍTÁSA</a>
    <button
      type="button"
      class="menu-toggle"
      (click)="isCollapsed = !isCollapsed"
      [attr.aria-expanded]="isCollapsed"
      aria-controls="mobile-menu"
      aria-label="Menü megnyitása"
    >
      ☰
    </button>
  </div>
</header>

<nav id="mobile-menu" class="mobile-menu" [class.mobile-menu--open]="isCollapsed" aria-label="Mobil navigáció">
  <a routerLink="/place/GameBeginning" (click)="isCollapsed = false">Játék</a>
  <a routerLink="/preface" (click)="isCollapsed = false">Előszó</a>
  <a routerLink="/map" (click)="isCollapsed = false">Térkép</a>
  <a routerLink="/contact" (click)="isCollapsed = false">Kapcsolat</a>
  @if ((auth.user$ | async)?.role === 3) {
    <a routerLink="/allplace" (click)="isCollapsed = false">Helyszínek</a>
    <a routerLink="/users" (click)="isCollapsed = false">Felhasználók</a>
  }
  @if (auth.user$ | async) {
    <button type="button" (click)="auth.logout(); isCollapsed = false">Kijelentkezés</button>
  } @else {
    <a routerLink="/login" (click)="isCollapsed = false">Bejelentkezés</a>
  }
</nav>
